# Two jobs, no secrets: the LLM key is never needed in CI and real-LLM evals never run here.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # No `version`: the action reads it from package.json's packageManager field.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test

  integration:
    name: Compose stack, smoke, integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start the stack
        run: docker compose up --build -d
      - run: pnpm smoke
      - name: Integration tests
        run: pnpm test:integration
        env:
          # Fresh stack owned by this job, so tests that restart containers are safe here.
          INTEGRATION_RESTARTS: '1'
      - name: Compose logs
        if: failure()
        run: docker compose logs --no-color --timestamps
      - name: Stop the stack
        if: always()
        run: docker compose down -v
