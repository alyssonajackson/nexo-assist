# Local stack: `docker compose up --build`
# Everything runs without an AWS account: Floci emulates Cognito and SQS behind one endpoint.
name: nexo-assist

x-aws-local: &aws-local
  AWS_REGION: us-east-1
  AWS_ACCESS_KEY_ID: local
  AWS_SECRET_ACCESS_KEY: local
  COGNITO_ENDPOINT: http://floci:4566
  COGNITO_USER_POOL_NAME: nexo-assist
  # Floci signs `iss` with its FLOCI_BASE_URL (set below), whatever host the request came in on.
  # The JWKS is fetched over the compose network.
  COGNITO_ISSUER_DOMAIN: http://localhost:4566
  COGNITO_JWKS_DOMAIN: http://floci:4566
  SQS_ENDPOINT: http://floci:4566
  MONGODB_URI: mongodb://mongo:27017/?replicaSet=rs0

services:
  mongo:
    image: mongo:8.0
    command: ['--replSet', 'rs0', '--bind_ip_all']
    ports: ['27017:27017']
    volumes: ['mongo-data:/data/db']
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20

  # One endpoint for Cognito and SQS. Persistent storage keeps the user pool, users and queued messages.
  floci:
    image: floci/floci:2.3.0
    ports: ['4566:4566']
    environment:
      FLOCI_STORAGE_MODE: persistent
      FLOCI_STORAGE_PERSISTENT_PATH: /app/data
      FLOCI_BASE_URL: http://localhost:4566
    volumes: ['floci-data:/app/data']

  # One-shot: replica set, Cognito pool/groups/users, SQS queues, seed data relative to "now". Idempotent.
  init:
    build: { context: ., dockerfile: docker/scripts.Dockerfile }
    command: ['pnpm', '--filter', '@nexo/scripts', 'init:local']
    environment:
      <<: *aws-local
      MONGODB_URI: mongodb://mongo:27017/?directConnection=true
      MONGO_REPLICA_HOST: mongo:27017
      SEED_PASSWORD: ${SEED_PASSWORD:-nexo123}
    depends_on:
      mongo: { condition: service_healthy }
      floci: { condition: service_healthy }
    restart: 'no'

  tickets:
    build: { context: ., dockerfile: docker/tickets.Dockerfile }
    ports: ['4000:4000']
    env_file: [{ path: .env, required: false }]
    environment:
      <<: *aws-local
      TICKETS_PORT: 4000
      # Simulated legacy flakiness: an outage of 3-8 s every ~2 min. The chaos endpoint is local-only.
      FLAKY_ENABLED: ${FLAKY_ENABLED:-true}
      CHAOS_ENABLED: 'true'
    depends_on:
      init: { condition: service_completed_successfully }
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:4000/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 20

  web:
    build: { context: ., dockerfile: docker/web.Dockerfile }
    ports: ['3000:3000']
    env_file: [{ path: .env, required: false }]
    environment:
      <<: *aws-local
      TICKETS_URL: http://tickets:4000
      # Secrets passed through from your shell (Keychain) or .env; never baked into the image.
      GOOGLE_GENERATIVE_AI_API_KEY: ${GOOGLE_GENERATIVE_AI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    depends_on:
      init: { condition: service_completed_successfully }
      tickets: { condition: service_healthy }

volumes:
  mongo-data:
  floci-data:
