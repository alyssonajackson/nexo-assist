# ElasticMQ: SQS-compatible emulator for local runs (no AWS account needed).
# Mirrors the real queues created by infra/ for AWS: three standard queues, each with a DLQ.
include classpath("application.conf")

node-address {
  protocol = http
  host = localhost
  port = 9324
  context-path = ""
}

rest-sqs {
  enabled = true
  bind-port = 9324
  bind-hostname = "0.0.0.0"
  sqs-limits = strict
}

# Keep pending messages across restarts ("pendente de registro" must survive a restart).
messages-storage {
  enabled = true
  uri = "jdbc:h2:/data/elasticmq"
}

queues {
  # web -> tickets: confirmed writes that could not be applied during an outage
  ticket-writes {
    defaultVisibilityTimeout = 30 seconds
    receiveMessageWait = 20 seconds
    deadLettersQueue { name = "ticket-writes-dlq", maxReceiveCount = 5 }
  }
  ticket-writes-dlq {}

  # tickets -> web: results of deferred writes (ticket.registered / ticket.write_failed)
  assist-events {
    defaultVisibilityTimeout = 30 seconds
    receiveMessageWait = 20 seconds
    deadLettersQueue { name = "assist-events-dlq", maxReceiveCount = 5 }
  }
  assist-events-dlq {}

  # web -> tickets: handoff events (transferred / assumed / released / closed) for the ticket timeline
  handoff-events {
    defaultVisibilityTimeout = 30 seconds
    receiveMessageWait = 20 seconds
    deadLettersQueue { name = "handoff-events-dlq", maxReceiveCount = 5 }
  }
  handoff-events-dlq {}
}
